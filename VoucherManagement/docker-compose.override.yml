services:
  voucher-management-api:
    build:
      context: .
      dockerfile: VoucherManagement.Api/Dockerfile
    depends_on:
      - voucher-management-db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__AppDbConnection=${ConnectionStrings__AppDbConnection}
      - Auth0__Domain=${Auth0__Domain}
      - Auth0__Audience=${Auth0__Audience}
    volumes:
      - ${BRANDING_PATH}:/app/Branding:ro
      - ${PDF_TEMPLATE_PATH}:/app/PdfTemplates:ro
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - voucher-management-network

  voucher-management-client:
    build:
      context: ./VoucherManagement.Client
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${Auth0__Domain}
        VITE_AUTH0_CLIENT_ID: ${Auth0__ClientId}
        VITE_AUTH0_AUDIENCE: ${Auth0__Audience}
        VITE_AUTH0_SCOPE: ${Auth0__Scope}
        VITE_API_URL: ${API_URL}
    depends_on:
      - voucher-management-api
    ports:
      - 8082:80
    networks:
      - voucher-management-network

  voucher-management-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA}:/var/lib/postgresql/data
    networks:
      - voucher-management-network

networks:
  voucher-management-network:
  proxy:
    driver: bridge